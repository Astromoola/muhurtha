<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panchanga Calendar</title>
    <link rel="stylesheet" href="./day.css" />
    <link rel="stylesheet" href="./landing.css" />
  </head>
  <body>
    <div class="day-shell">
      <header class="glass landing-hero">
        <div>
          <div class="landing-title">Panchanga Calendar</div>
          <div id="landingMeta" class="meta">Loading city…</div>
        </div>
        <div class="landing-controls">
          <label class="control-block">
            <span>Year</span>
            <select id="yearSelect" class="input"></select>
          </label>
          <button id="jumpToday" class="button ghost" type="button">Today</button>
          <button id="filterBtn" class="button ghost icon-button" type="button" aria-label="Filters">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M3 5h18l-7 8v5l-4 2v-7L3 5z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linejoin="round"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </header>

      <div id="activeFilters" class="active-filters hidden"></div>

      <main id="calendar" class="landing-calendar"></main>
    </div>

    <div id="filterBackdrop" class="filter-backdrop hidden">
      <div class="filter-panel">
        <header class="filter-header">
          <div>
            <div class="filter-title">Filters</div>
            <div class="filter-subtitle">Select multiple values to narrow dates.</div>
          </div>
          <button id="filterClose" class="button ghost icon-button" type="button" aria-label="Close filters">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M6 6l12 12M18 6l-12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </header>
        <div id="filterGroups" class="filter-groups"></div>
        <footer class="filter-footer">
          <button id="filterClear" class="button ghost" type="button">Clear</button>
          <button id="filterApply" class="button" type="button">Apply</button>
        </footer>
      </div>
    </div>

    <script type="module" src="./landing.js"></script>
  </body>
</html>
